; ============================================================================
;  Dynamic Hit Feedback - settings        (GTA San Andreas 1.0 US)
;  Put this file next to DynamicHitFeedback.asi. Comments must be on their own line.
; ============================================================================

[General]
; 0 turns the whole mod off without removing the file
Enabled=1
; CJ is excluded by default (the Bullet Physics Ragdoll mod does not handle him either)
AffectPlayer=0
; writes DynamicHitFeedback.log next to the .asi - leave on while testing
Log=1
; peds further than this many metres from the player are ignored
MaxDistance=80
; remove the stock flinch animations (DAM_*, SHOT_*, HIT_*) for a short time after a bullet hits a ped
SuppressVanillaHitAnims=1
SuppressWindowMs=900
; comma separated list of animation names treated as "vanilla bullet hit reactions"
SuppressAnimNames=DAM_ARML_FRM,DAM_ARMR_FRM,DAM_LEGL_FRM,DAM_LEGR_FRM,DAM_STOMACH_FRM,DAM_ARML_BCK,DAM_ARMR_BCK,DAM_LEGL_BCK,DAM_LEGR_BCK,DAM_STOMACH_BCK,DAM_ARML_L,DAM_ARMR_L,DAM_ARML_R,DAM_ARMR_R,SHOT_PARTIAL,SHOT_PARTIAL_B,SHOT_LEFTP,SHOT_RIGHTP,HIT_FRONT,HIT_BACK,HIT_L,HIT_R,HIT_BEHIND,HIT_WALK

[Reaction]
; master strength. 0.5 = subtle, 1 = default, 1.5 = exaggerated
GlobalIntensity=1.0
; random variation per hit (0 = every hit identical)
Randomness=0.20
; per-body-part multipliers
ArmFlinch=1.0
LegFlinch=1.0
TorsoBend=1.0
HeadSnap=1.0
; scales every bone's maximum swing angle
MaxAngleScale=1.0
; small shove along the bullet direction for medium/heavy weapons (0 = off)
Knockback=0.5
; the reaction starts this many ms after the bullet so killing shots can be skipped (the ragdoll mod owns dead peds)
HitDelayMs=34

[Weapons]
; weapon id = intensity.  0 = no reaction.
; light (< 0.7)  : tap       medium (< 1.15): jolt       heavy: blow (also decides trip chance)
; 22 Colt 45, 23 Silenced, 24 Desert Eagle, 25 Shotgun, 26 Sawn-off, 27 SPAS-12, 28 Micro SMG, 29 MP5,
; 30 AK-47, 31 M4, 32 Tec-9, 33 Country Rifle, 34 Sniper, 38 Minigun (per bullet)
22=0.55
23=0.50
24=1.00
25=1.45
26=1.50
27=1.40
28=0.50
29=0.55
30=0.95
31=0.90
32=0.50
33=1.25
34=1.70
38=0.55

[Trip]
; running ped shot in the foot / calf (or thigh, less likely) stumbles and falls
Enabled=1
; ped move state that counts as running: 4 walk, 5 jog, 6 run, 7 sprint
MinMoveState=6
; alternative speed test (game units per tick)
MinSpeed=0.05
; chance per weapon class that a qualifying hit trips the ped
ChanceLight=0.45
ChanceMedium=0.70
ChanceHeavy=0.95
; chance multiplier when the thigh instead of calf/foot is hit
ThighChanceScale=0.45
CooldownMs=4000
; hand the fall to the game's own TASK_FALL_AND_GET_UP through the CLEO bridge script (see README).
; That is what lets the Bullet Physics Ragdoll mod take over. Without the script only a stumble is played.
UseCleoBridge=1
BridgeTimeoutMs=450
; how long the ped stays down before the vanilla get-up animation (ms)
GroundTimeMs=1800
; value of the "fall_down" parameter of opcode 05BB
FallDownParam=1
StumbleScale=1.0

[GetUpBlend]
; smooth the pop between the ragdoll pose and the vanilla get-up animation
Enabled=1
; seconds to ease from the ragdoll pose into the animation
BlendTime=0.35
; the blend engages when the pose gap between the last displayed frame and the animation exceeds this many degrees...
TriggerDegrees=35
; ...and ends once the gap stays under this
EndDegrees=6
; how long after a fall / get-up animation is seen (or a trip happens) the blend stays armed
WatchWindowMs=6000
; 1 = always armed for every ped (use if the ragdoll mod does not use the animations below)
WatchAlways=0
WatchAnimNames=GETUP,GETUP_FRONT,FALL_FRONT,FALL_BACK,FALL_COLLAPSE,KO_SKID_FRONT,KO_SKID_BACK,KO_SHOT_FRONT,KO_SHOT_STOM,KO_SHOT_FACE,KO_SPIN_L,KO_SPIN_R
